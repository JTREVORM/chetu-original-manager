<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No connection — Chetu Microfinance</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0B4394; color: #fff; font-family: "Segoe UI", Arial, sans-serif; padding: 24px; }
    .box { max-width: 380px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #c7d7f0; margin: 0 0 20px; }
    button { background: #fff; color: #0B4394; border: 0; border-radius: 8px;
             padding: 12px 24px; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <h1>No connection</h1>
    <p>
      Chetu Microfinance needs a network connection — member records, loans and collections are read
      live so you are never shown an out-of-date balance.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
